services:
  - type: web
    name: altin
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ORGANIZER_EMAIL
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_API_BASE_URL
        value: https://api.meta.ai/v1
      - key: MUSE_SPARK_MODEL
        value: muse-spark-1.3
